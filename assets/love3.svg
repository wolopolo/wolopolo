<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="100%" height="100%">
  <defs>
    <linearGradient id="coffee-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#coffee-grad)" />
  
  <!-- Cozy coffee details -->
  <!-- Table background -->
  <rect y="170" width="300" height="80" fill="#fdba74" opacity="0.4" />
  <line x1="0" y1="170" x2="300" y2="170" stroke="#f97316" stroke-width="1.5" opacity="0.2" />

  <!-- Coffee Cup Left (Blue) -->
  <g transform="translate(100, 140)">
    <!-- Plate -->
    <ellipse cx="0" cy="25" rx="35" ry="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Handle -->
    <path d="M-22 -2 C-38 -2 -38 12 -22 12" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" />
    <!-- Cup Body -->
    <path d="M-25 -10 h50 L20 20 A20 20 0 0 1 -20 20 Z" fill="#0ea5e9" />
    <!-- Coffee Surface -->
    <ellipse cx="0" cy="-10" rx="25" ry="6" fill="#7c2d12" />
    <ellipse cx="-2" cy="-9" rx="18" ry="4" fill="#9a3412" />
    <!-- Latte Art Heart -->
    <path d="M0 -11 Q-5 -15 -8 -11 Q-11 -7 -5 -1 L0 3 L5 -1 Q11 -7 8 -11 Q5 -15 0 -11 Z" fill="#ffedd5" transform="scale(0.6) translate(-2, -15)" />
  </g>

  <!-- Coffee Cup Right (Pink) -->
  <g transform="translate(195, 140) scale(-1, 1)">
    <!-- Plate -->
    <ellipse cx="0" cy="25" rx="35" ry="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Handle -->
    <path d="M-22 -2 C-38 -2 -38 12 -22 12" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round" />
    <!-- Cup Body -->
    <path d="M-25 -10 h50 L20 20 A20 20 0 0 1 -20 20 Z" fill="#ec4899" />
    <!-- Coffee Surface -->
    <ellipse cx="0" cy="-10" rx="25" ry="6" fill="#7c2d12" />
    <ellipse cx="-2" cy="-9" rx="18" ry="4" fill="#9a3412" />
    <!-- Latte Art Heart -->
    <path d="M0 -11 Q-5 -15 -8 -11 Q-11 -7 -5 -1 L0 3 L5 -1 Q11 -7 8 -11 Q5 -15 0 -11 Z" fill="#ffedd5" transform="scale(0.6) translate(-2, -15)" />
  </g>

  <!-- Steam rising from cups -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M90 90 Q95 75 90 65 T95 45" />
    <path d="M110 95 Q105 80 110 70 T105 50" />
    
    <path d="M190 90 Q185 75 190 65 T185 45" />
    <path d="M210 95 Q205 80 210 70 T205 50" />
  </g>
</svg>
