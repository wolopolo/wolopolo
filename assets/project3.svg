<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="proj3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bubble-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#proj3-grad)" />
  <!-- Grid -->
  <g stroke="rgba(255,255,255,0.02)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="250" />
    <line x1="100" y1="0" x2="100" y2="250" />
    <line x1="150" y1="0" x2="150" y2="250" />
    <line x1="200" y1="0" x2="200" y2="250" />
    <line x1="250" y1="0" x2="250" y2="250" />
    <line x1="300" y1="0" x2="300" y2="250" />
    <line x1="350" y1="0" x2="350" y2="250" />
  </g>
  <!-- Chat App UI Frame -->
  <rect x="50" y="20" width="300" height="210" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  
  <!-- Left Side Channel bar -->
  <rect x="50" y="20" width="70" height="210" rx="8" fill="#0f172a" />
  <circle cx="85" cy="45" r="12" fill="#10b981" />
  <circle cx="85" cy="80" r="10" fill="rgba(255,255,255,0.1)" />
  <circle cx="85" cy="110" r="10" fill="rgba(255,255,255,0.1)" />
  <circle cx="85" cy="140" r="10" fill="rgba(255,255,255,0.05)" />
  
  <!-- Chat Window -->
  <!-- Top bar -->
  <rect x="120" y="20" width="230" height="35" rx="2" fill="#111827" />
  <circle cx="140" cy="37" r="8" fill="#10b981" />
  <rect x="155" y="34" width="60" height="6" rx="3" fill="#f8fafc" />
  
  <!-- Messages bubbles -->
  <!-- Left bubble -->
  <path d="M135 75 h100 a10 10 0 0 1 10 10 v15 a10 10 0 0 1 -10 10 h-92 l-8 8 v-8 a10 10 0 0 1 -10 -10 v-15 a10 10 0 0 1 10 -10 z" fill="#374151" />
  <rect x="150" y="85" width="70" height="5" rx="2.5" fill="rgba(255,255,255,0.3)" />
  <rect x="150" y="95" width="50" height="5" rx="2.5" fill="rgba(255,255,255,0.15)" />
  <circle cx="140" cy="90" r="4" fill="#38bdf8" />

  <!-- Right bubble -->
  <path d="M230 125 h90 a10 10 0 0 1 10 10 v15 a10 10 0 0 1 -10 10 h-80 l-10 8 v-8 a10 10 0 0 1 -10 -10 v-15 a10 10 0 0 1 10 -10 z" fill="url(#bubble-grad)" transform="translate(540, 290) scale(-1, 1) translate(-290, -125)" />
  <rect x="250" y="135" width="60" height="5" rx="2.5" fill="rgba(255,255,255,0.3)" />
  <rect x="250" y="145" width="40" height="5" rx="2.5" fill="rgba(255,255,255,0.15)" />

  <!-- Bottom Message Input area -->
  <rect x="130" y="185" width="210" height="30" rx="15" fill="#111827" />
  <rect x="145" y="196" width="100" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  <!-- Send button -->
  <circle cx="325" cy="200" r="10" fill="#10b981" />
  <path d="M322 200 l4-4 4 4 M326 196 v8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" />
</svg>
