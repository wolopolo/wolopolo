<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="100%" height="100%">
  <defs>
    <linearGradient id="love1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#love1-grad)" />
  
  <!-- Decorative small hearts -->
  <path d="M50 40 Q40 20 60 20 Q80 20 70 40 L60 50 Z" fill="#fda4af" opacity="0.6" transform="scale(0.8) rotate(-15 50 40)" />
  <path d="M220 50 Q210 30 230 30 Q250 30 240 50 L230 60 Z" fill="#fda4af" opacity="0.6" transform="scale(0.7) rotate(20 220 50)" />
  
  <!-- Main Giant Heart Graphic -->
  <g transform="translate(150, 110)">
    <!-- Heart outline/fill -->
    <path d="M0 -30 Q-45 -70 -75 -40 Q-105 -10 -55 35 L0 80 L55 35 Q105 -10 75 -40 Q45 -70 0 -30 Z" fill="#f43f5e" />
    <!-- Cute face inside heart -->
    <!-- Eyes -->
    <circle cx="-20" cy="-5" r="4" fill="#ffffff" />
    <circle cx="-19" cy="-7" r="1.5" fill="#000000" />
    <circle cx="20" cy="-5" r="4" fill="#ffffff" />
    <circle cx="21" cy="-7" r="1.5" fill="#000000" />
    <!-- Blushing cheeks -->
    <ellipse cx="-28" cy="4" rx="6" ry="3" fill="#fda4af" opacity="0.8" />
    <ellipse cx="28" cy="4" rx="6" ry="3" fill="#fda4af" opacity="0.8" />
    <!-- Happy smile mouth -->
    <path d="M-8 8 Q0 15 8 8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
