<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="blog1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#blog1-grad)" />
  <!-- Wave pattern -->
  <path d="M0 180 Q100 130 200 180 T400 180 L400 250 L0 250 Z" fill="rgba(99, 102, 241, 0.05)" />
  <path d="M0 200 Q80 160 200 210 T400 200 L400 250 L0 250 Z" fill="rgba(168, 85, 247, 0.05)" />
  
  <!-- Glowing circle -->
  <circle cx="200" cy="110" r="50" fill="url(#glow-grad)" opacity="0.15" filter="url(#glow)" />
  <circle cx="200" cy="110" r="40" fill="url(#glow-grad)" opacity="0.8" />
  
  <!-- Notebook and Pen Drawing -->
  <g fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Document pad -->
    <rect x="175" y="85" width="50" height="50" rx="4" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" />
    <!-- Lines -->
    <line x1="185" y1="97" x2="215" y2="97" stroke="rgba(248, 250, 252, 0.6)" stroke-width="1.5" />
    <line x1="185" y1="107" x2="215" y2="107" stroke="rgba(248, 250, 252, 0.6)" stroke-width="1.5" />
    <line x1="185" y1="117" x2="205" y2="117" stroke="rgba(248, 250, 252, 0.6)" stroke-width="1.5" />
    <!-- Feather pen -->
    <path d="M225 70 L212 95 L215 98 L228 73 Q235 60 225 70" fill="url(#glow-grad)" stroke="#f8fafc" stroke-width="1.5" />
    <path d="M212 95 l-4 8" stroke="#f8fafc" stroke-width="1.5" />
  </g>
  <!-- Welcome text -->
  <text x="200" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    HELLO WORLD!
  </text>
  <text x="200" y="205" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Chào mừng tới không gian chia sẻ
  </text>
</svg>
