<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#avatar-grad)" />
  <circle cx="100" cy="100" r="85" fill="#080c14" />
  <!-- Developer Avatar Illustration -->
  <g fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Monitor background -->
    <rect x="60" y="55" width="80" height="55" rx="6" stroke="#06b6d4" stroke-width="4" filter="url(#glow)" />
    <!-- Laptop keyboard base -->
    <path d="M50 120 h100 l5 15 h-110 z" fill="#1e293b" />
    <!-- Stand -->
    <path d="M90 110 v12 h20 v-12" />
    <!-- Code brackets -->
    <path d="M85 73 l-8 7 8 7 M115 73 l8 7-8 7" stroke="#6366f1" stroke-width="4" />
    <path d="M103 70 l-6 16" stroke="#06b6d4" stroke-dasharray="2 1" />
  </g>
  <!-- Initials -->
  <text x="100" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    WOLOPOLO
  </text>
</svg>
