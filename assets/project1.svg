<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="proj1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#proj1-grad)" />
  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="250" />
    <line x1="100" y1="0" x2="100" y2="250" />
    <line x1="150" y1="0" x2="150" y2="250" />
    <line x1="200" y1="0" x2="200" y2="250" />
    <line x1="250" y1="0" x2="250" y2="250" />
    <line x1="300" y1="0" x2="300" y2="250" />
    <line x1="350" y1="0" x2="350" y2="250" />
    
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
  </g>
  <!-- Dashboard UI Elements -->
  <rect x="20" y="20" width="360" height="210" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.07)" stroke-width="2" />
  <!-- Sidebar -->
  <rect x="20" y="20" width="80" height="210" rx="8" fill="#0f172a" />
  <circle cx="45" cy="45" r="10" fill="url(#accent-grad)" />
  <rect x="35" y="75" width="50" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
  <rect x="35" y="95" width="50" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="35" y="115" width="50" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  <!-- Header inside dashboard -->
  <rect x="115" y="35" width="250" height="25" rx="4" fill="rgba(255,255,255,0.03)" />
  <circle cx="340" cy="47" r="6" fill="#06b6d4" />
  <!-- Charts -->
  <rect x="115" y="75" width="115" height="65" rx="6" fill="#0f172a" />
  <path d="M125 125 L145 105 L165 115 L185 90 L205 100 L220 85" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <circle cx="220" cy="85" r="3" fill="#06b6d4" />

  <rect x="250" y="75" width="115" height="65" rx="6" fill="#0f172a" />
  <!-- Bar chart -->
  <rect x="265" y="115" width="10" height="15" rx="2" fill="#6366f1" />
  <rect x="285" y="100" width="10" height="30" rx="2" fill="#6366f1" />
  <rect x="305" y="90" width="10" height="40" rx="2" fill="url(#accent-grad)" />
  <rect x="325" y="105" width="10" height="25" rx="2" fill="#6366f1" />
  <rect x="345" y="95" width="10" height="35" rx="2" fill="#6366f1" />

  <!-- Lower table list -->
  <rect x="115" y="155" width="250" height="60" rx="6" fill="#0f172a" />
  <line x1="125" y1="175" x2="355" y2="175" stroke="rgba(255,255,255,0.05)" />
  <line x1="125" y1="195" x2="355" y2="195" stroke="rgba(255,255,255,0.05)" />
  <rect x="130" y="163" width="60" height="6" rx="3" fill="rgba(255,255,255,0.2)" />
  <rect x="130" y="182" width="80" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
  <rect x="130" y="202" width="70" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
</svg>
