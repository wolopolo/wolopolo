<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday pà chã hơm 🎂</title>
  <link rel="stylesheet" href="birthday.css">
</head>
<body>

  <!-- Background sparkles -->
  <div class="stars" id="stars"></div>

  <!-- Stage 1: Cake -->
  <section class="cake-stage" id="cakeStage">
    <p class="hint">Pà chã ưii, <br /> hãy vào chiếc bánh kì diệu này nhé ✨</p>

    <button class="cake" id="cake" aria-label="Mở lời chúc">
      <div class="candles">
        <div class="candle"><div class="flame"></div></div>
        <div class="candle"><div class="flame"></div></div>
        <div class="candle"><div class="flame"></div></div>
      </div>
      <div class="layer layer-top">
        <div class="icing"></div>
      </div>
      <div class="layer layer-mid"></div>
      <div class="layer layer-bottom"></div>
      <div class="plate"></div>
    </button>
  </section>

  <!-- Flash overlay -->
  <div class="flash" id="flash"></div>

  <!-- Stage 2: Wishes + photos -->
  <section class="wish-stage" id="wishStage" hidden>
    <h1 class="wish-title">Happy Birthday!</h1>
    <p class="wish-message" id="wishMessage"></p>
    <div class="gallery" id="gallery"></div>
  </section>

  <div class="confetti" id="confetti"></div>

  <button class="music-toggle" id="musicToggle" aria-label="Bật/tắt nhạc" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path class="note" d="M9 18V5l11-2v13" />
      <circle class="note" cx="6" cy="18" r="3" />
      <circle class="note" cx="17" cy="16" r="3" />
      <line class="slash" x1="3" y1="3" x2="21" y2="21" />
    </svg>
  </button>

  <script src="birthday.js"></script>
</body>
</html>
